<!DOCTYPE html>
<html class="staticrypt-html">
    <head>
        <meta charset="utf-8" />
        <title>Bernardo Prudêncio</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex, nofollow" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <style>
            @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Mono:ital,wght@0,400;1,400&display=swap');

            :root {
                --bg: #F0F0EE;
                --card: #FFFFFF;
                --text: #111111;
                --muted: #6B7280;
                --accent: #2563EB;
                --border: #E5E7EB;
                --font-body: 'Inter', system-ui, sans-serif;
                --font-mono: 'Space Mono', monospace;
            }

            *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

            .staticrypt-html { height: 100%; }

            .staticrypt-body {
                height: 100%;
                background: var(--bg);
                font-family: var(--font-body);
                color: var(--text);
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            /* ─── SITE HEADER ─── */
            .staticrypt-header {
                position: sticky;
                top: 0;
                z-index: 200;
                background: rgba(240,240,238,0.92);
                backdrop-filter: blur(12px);
                border-bottom: 1px solid var(--border);
            }

            .staticrypt-header-inner {
                display: flex;
                align-items: center;
                max-width: 1400px;
                margin: 0 auto;
                padding: 1rem 24px;
            }

            .staticrypt-logo {
                font-weight: 700;
                font-size: 0.95rem;
                color: var(--text);
                text-decoration: none;
            }

            /* ─── MAIN ─── */
            .staticrypt-main {
                min-height: calc(100vh - 61px);
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 2rem 1rem;
            }

            /* ─── CARD ─── */
            .staticrypt-form {
                background: var(--card);
                border-radius: 16px;
                border: 1px solid var(--border);
                width: 100%;
                max-width: 360px;
                padding: 2rem;
            }

            .staticrypt-instructions {
                margin-bottom: 1.25rem;
            }

            .staticrypt-title {
                font-size: 1rem;
                font-weight: 700;
                color: var(--text);
                margin-bottom: 0.3rem;
            }

            .staticrypt-instructions p:not(.staticrypt-title) {
                font-size: 0.85rem;
                color: var(--muted);
                line-height: 1.55;
            }

            .staticrypt-hr {
                margin: 0 0 1.25rem;
                border: 0;
                border-top: 1px solid var(--border);
            }

            /* ─── PASSWORD INPUT ─── */
            .staticrypt-password-container {
                position: relative;
                background: var(--bg);
                border: 1px solid var(--border);
                border-radius: 8px;
                width: 100%;
                margin: 0 0 10px;
            }

            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                background: transparent;
                border: 0;
                box-sizing: border-box;
                font-family: var(--font-body);
                font-size: 0.9rem;
                outline: 0;
                padding: 11px 40px 11px 13px;
                width: 100%;
                color: var(--text);
                border-radius: 8px;
            }

            .staticrypt-form input[type="password"]::placeholder,
            .staticrypt-form input[type="text"]::placeholder {
                color: var(--muted);
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 18px;
                width: 18px;
                opacity: 0.35;
                position: absolute;
                right: 11px;
                top: 50%;
                transform: translateY(-50%);
                transition: opacity 0.15s;
            }

            .staticrypt-toggle-password-visibility:hover { opacity: 0.65; }

            /* ─── BUTTON ─── */
            .staticrypt-form .staticrypt-decrypt-button {
                font-family: var(--font-body);
                font-size: 0.85rem;
                font-weight: 600;
                background: var(--accent);
                color: #fff;
                border: 0;
                border-radius: 8px;
                width: 100%;
                padding: 11px;
                cursor: pointer;
                outline: 0;
                transition: filter 0.2s;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                filter: brightness(92%);
            }

            /* ─── REMEMBER ME ─── */
            label.staticrypt-remember {
                display: flex;
                align-items: center;
                margin-bottom: 0.75rem;
                font-size: 0.82rem;
                color: var(--muted);
            }

            .staticrypt-remember input[type="checkbox"] {
                transform: scale(1.25);
                margin-right: 0.5rem;
                accent-color: var(--accent);
            }

            /* ─── SPINNER ─── */
            .staticrypt-spinner-container {
                height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                background: var(--bg);
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                border: 0.2em solid var(--border);
                border-right-color: var(--accent);
                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }

            @keyframes spinner-border {
                100% { transform: rotate(360deg); }
            }

            .hidden { display: none !important; }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                .staticrypt-form input[type="text"] {
                    font-size: 16px;
                }
            }

            @media (max-width: 539px) {
                .staticrypt-header-inner { padding: 0.75rem 16px; }
            }
        </style>
    </head>
